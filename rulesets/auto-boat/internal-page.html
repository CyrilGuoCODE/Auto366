<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
<script>
// ===== 屏显诊断层：天学网客户端 WebView 屏蔽控制台，用常驻浮层把游戏页加载状态
//      直接显示在屏幕上，便于排查"白屏/没反应"；可拖拽、可收起、可关闭（控制面板联动） =====
(function () {
    var layer = null, header = null, body = null, collapseBtn = null, closeBtn = null;
    var visible = true;
    var collapsed = false;
    var dragging = false, dragStartX = 0, dragStartY = 0, startLeft = 0, startTop = 0;

    function notify() {
        try { if (window.__gameDiagPanelSync) window.__gameDiagPanelSync({ visible: visible, collapsed: collapsed }); } catch (e) {}
    }

    function ensureEl() {
        if (layer) return layer;
        layer = document.createElement('div');
        layer.id = 'a366-game-diag';
        layer.style.cssText = 'position:fixed;left:8px;top:8px;z-index:2147483646;width:200px;max-width:46vw;' +
            'background:rgba(0,0,0,.78);color:#0f0;font:11px/1.5 monospace;border-radius:6px;' +
            'box-shadow:0 2px 6px rgba(0,0,0,.3);';

        header = document.createElement('div');
        header.style.cssText = 'display:flex;align-items:center;padding:3px 6px;cursor:move;background:rgba(255,255,255,.10);border-radius:6px 6px 0 0;user-select:none;';
        var title = document.createElement('span');
        title.textContent = '诊断';
        title.style.cssText = 'flex:1;color:#cfc;font-size:11px;';
        collapseBtn = document.createElement('button');
        collapseBtn.textContent = '收起';
        collapseBtn.style.cssText = 'margin-left:4px;padding:1px 5px;font-size:10px;line-height:1.4;color:#0f0;background:transparent;border:1px solid rgba(0,255,0,.4);border-radius:3px;cursor:pointer;';
        closeBtn = document.createElement('button');
        closeBtn.textContent = '关闭';
        closeBtn.style.cssText = 'margin-left:4px;padding:1px 5px;font-size:10px;line-height:1.4;color:#f66;background:transparent;border:1px solid rgba(255,0,0,.4);border-radius:3px;cursor:pointer;';
        header.appendChild(title);
        header.appendChild(collapseBtn);
        header.appendChild(closeBtn);

        body = document.createElement('div');
        body.style.cssText = 'max-height:150px;overflow:auto;padding:4px 6px;white-space:pre-wrap;word-break:break-all;';

        layer.appendChild(header);
        layer.appendChild(body);
        (document.body || document.documentElement).appendChild(layer);

        collapseBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleCollapse(); });
        closeBtn.addEventListener('click', function (e) { e.stopPropagation(); setVisible(false); });

        // 拖拽（按住标题栏移动）
        header.addEventListener('mousedown', function (e) {
            if (e.target === collapseBtn || e.target === closeBtn) return;
            var r = layer.getBoundingClientRect();
            dragStartX = e.clientX; dragStartY = e.clientY;
            startLeft = r.left; startTop = r.top;
            dragging = true;
            e.preventDefault();
        });
        document.addEventListener('mousemove', function (e) {
            if (!dragging) return;
            var nx = Math.max(0, Math.min(window.innerWidth - 80, startLeft + (e.clientX - dragStartX)));
            var ny = Math.max(0, Math.min(window.innerHeight - 28, startTop + (e.clientY - dragStartY)));
            layer.style.left = nx + 'px';
            layer.style.top = ny + 'px';
        });
        document.addEventListener('mouseup', function () { dragging = false; });
        return layer;
    }

    function toggleCollapse() {
        collapsed = !collapsed;
        body.style.display = collapsed ? 'none' : 'block';
        collapseBtn.textContent = collapsed ? '展开' : '收起';
        layer.style.width = collapsed ? 'auto' : '200px';
        notify();
    }

    function setVisible(v) {
        visible = !!v;
        if (layer) layer.style.display = visible ? 'block' : 'none';
        notify();
    }

    function diag(msg) {
        try { console.log('[Auto366:game] ' + msg); } catch (e) {}
        try {
            var el = ensureEl();
            var line = document.createElement('div');
            line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            body.appendChild(line);
            while (body.childNodes.length > 80) body.removeChild(body.firstChild);
            body.scrollTop = body.scrollHeight;
        } catch (e) {}
    }

    window.__gameDiag = diag;
    window.__gameDiagLayer = {
        open: function () { ensureEl(); setVisible(true); },
        close: function () { ensureEl(); setVisible(false); },
        toggle: function () { ensureEl(); setVisible(!visible); },
        isVisible: function () { return visible; },
        expand: function () { ensureEl(); if (collapsed) toggleCollapse(); },
        collapse: function () { ensureEl(); if (!collapsed) toggleCollapse(); }
    };

    window.onerror = function (m, src, ln, col, err) {
        diag('onerror: ' + m + (src ? ' @' + String(src).split('/').pop() + ':' + ln : '') + (err && err.stack ? ' | ' + String(err.stack).split('\n')[0] : ''));
        return false;
    };
    window.addEventListener('unhandledrejection', function (ev) {
        var r = ev && ev.reason;
        diag('unhandledrejection: ' + (r && r.message ? r.message : String(r)));
    });

    diag('诊断层已加载 url=' + location.href + '  System=' + (typeof window.System));
    // 轮询上报 bundle 是否加载成功
    var _w = setInterval(function () {
        if (typeof window.System !== 'undefined') {
            clearInterval(_w);
            diag('System 已就绪，polyfills/system bundle 加载成功');
        }
    }, 500);
    setTimeout(function () {
        if (typeof window.System === 'undefined') diag('10s 后 System 仍未定义，bundle 加载失败，页面将白屏');
    }, 10000);
})();
</script>
<script>
// ==UserScript==
// @name         百舸争流(龙舟)桌面桥接 + 自动答题
// @namespace    http://tampermonkey.net/
// @version      1.0.0
// @description  在电脑端把 Android/iOS 原生 WebViewJavascriptBridge 转成浏览器实现，
//              让 jc-regatta 大厅页(百舸争流)能在桌面浏览器正常运行；openWebView 打开
//              regatta 游戏页；游戏页由 Auto366 代理层替换为内置自动答题 HTML。
// @match        *://*/*
// @grant        none
// ==/UserScript==

(function () {
    'use strict';

    // ---------- 配置（可用 window.__A366_REGATTA__ 覆盖） ----------
    var CFG = (window.__A366_REGATTA__ && typeof window.__A366_REGATTA__ === 'object') ? window.__A366_REGATTA__ : {};
    var ENV = CFG.env || 'PRODUCT';       // PRODUCT / DEMO / TEST
    var CLIENT = CFG.client || 'UP366';   // UP366 / TXAI
    // bucket 端口占位符 __A366_BUCKET_PORT__ 由代理层替换为真实端口
    var BUCKET = (window.__A366__ && window.__A366__.bucket) || CFG.bucket || 'http://127.0.0.1:__A366_BUCKET_PORT__';

    var jsHandlers = {}; // registerHandler 注册的 JS 侧回调（JS→JS 自发自收）

    // 屏显诊断（复用诊断层，不存在时静默fallback）
    function gdiag(m) { try { window.__gameDiag && window.__gameDiag(m); } catch (e) {} }

    // ======================= 工具 =======================

    function ok(data) { return { result: { code: 0, msg: '' }, data: data }; }
    function fail(msg, code) {
        return { result: { code: (code === undefined ? -2000 : code), msg: String(msg || '未知错误') }, data: null };
    }

    function getAppInfoData() {
        return {
            platform: 'web',
            os: 'web',
            systemOS: 'web',
            client: CLIENT,
            versions: '1.0.0',
            version: '1.0.0',
            clientId: '',
            env: ENV,
            extraData: {},
            SDKVersion: '',
            osVersion: '',
            mobileModel: '',
            domain: undefined,
            scene: undefined
        };
    }

    // ======================= 桥方法实现 =======================

    // openWebView：桌面端 WebView 无多窗口能力(原生 openWebView 未实现)，
    // window.open 会返回不可见空窗口、看起来"点了没反应"。因此优先当前窗口跳转游戏页；
    // 若 WebView 拦截了跨 scheme 导航(local://→https)，1s 内仍停留在本页(可见)时，
    // 自动降级为全屏 iframe 加载游戏页。
    function loadGameInFrame(url) {
        try {
            var oldEl = document.getElementById('a366-game-frame');
            if (oldEl) oldEl.remove();
            var frame = document.createElement('iframe');
            frame.id = 'a366-game-frame';
            frame.src = url;
            frame.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;border:0;z-index:2147483647;background:#fff;';
            (document.body || document.documentElement).appendChild(frame);
            console.log('[Auto366:bridge] 导航被拦截，已用全屏 iframe 加载: ' + url);
            gdiag('导航被拦截 → 已用全屏 iframe 加载: ' + url);
        } catch (e) {
            try { console.log('[Auto366:bridge] iframe 兜底失败: ' + e); } catch (e2) {}
        }
    }

    function openWebView(params) {
        var url = params && params.url;
        try {
            console.log('[Auto366:bridge] openWebView url=' + url + ', openNewWebView=' + (params && params.openNewWebView));
        } catch (e) {}
        if (url) {
            gdiag('openWebView → 尝试跳转: ' + url);
            // 导航成功会销毁本页 JS 上下文，此定时器不会再执行；
            // 若 1s 后仍可见地停留本页，说明导航被拦截 → iframe 兜底
            setTimeout(function () {
                if (document && document.visibilityState !== 'hidden') {
                    loadGameInFrame(url);
                }
            }, 1000);
            try { window.location.href = url; } catch (e) { loadGameInFrame(url); }
        }
        return {};
    }

    function closeWebView() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            try { window.close(); } catch (e) {}
        }
        return {};
    }

    // 通过本地 bucket 转发 SDK 请求，规避浏览器跨域(CORS)限制；
    // 转发时带上页面 cookie，若大厅挂在 up366 域下即可继承登录态。
    function requestViaBucket(params) {
        return new Promise(function (resolve) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', BUCKET + '/a366-forward', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.timeout = params.timeout || 30000;
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) return;
                try {
                    var r = JSON.parse(xhr.responseText || '{}');
                    // bucket 转发层失败（success:false）时按失败处理，回退直连/报错
                    if (r && r.success === false) {
                        resolve({ raw: null, status: xhr.status, err: r.error || ('HTTP ' + xhr.status) });
                        return;
                    }
                    // bucket 转发返回 { status, headers, body }，body 即真实接口响应
                    resolve({ raw: (r && r.body !== undefined) ? r.body : r, status: xhr.status });
                } catch (e) {
                    resolve({ raw: null, status: xhr.status, err: String(e) });
                }
            };
            xhr.onerror = function () { resolve({ raw: null, status: 0, err: 'network-error' }); };
            xhr.ontimeout = function () { resolve({ raw: null, status: 0, err: 'timeout' }); };
            xhr.send(JSON.stringify({
                url: params.url,
                method: 'POST',
                headers: params.header || {},
                body: params.data || '',
                cookie: document.cookie || ''
            }));
        });
    }

    // 兜底：直接 fetch（同域/服务端已放开 CORS 时可用）
    function requestDirect(params) {
        return new Promise(function (resolve) {
            var header = params.header || {};
            var contentType = header['content-type'] || header['Content-Type'] || 'application/x-www-form-urlencoded';
            var h = { 'Content-Type': contentType };
            Object.keys(header).forEach(function (k) {
                if (/^content-type$/i.test(k)) return;
                h[k] = header[k];
            });
            var timer = setTimeout(function () { resolve({ raw: null, status: 0, err: 'timeout' }); }, params.timeout || 30000);
            fetch(params.url, {
                method: 'POST',
                headers: h,
                body: params.data || '',
                credentials: 'include'
            }).then(function (res) {
                return res.text();
            }).then(function (text) {
                clearTimeout(timer);
                var body = null;
                try { body = JSON.parse(text); } catch (e) { body = text; }
                resolve({ raw: body, status: 200 });
            }).catch(function (e) {
                clearTimeout(timer);
                resolve({ raw: null, status: 0, err: String(e && e.message || e) });
            });
        });
    }

    // request(handlerName="request")：SDK 请求 → 归一化成 { result, data } 返回
    function doRequest(params) {
        var attempt = function (mode) {
            var p = mode === 'direct' ? requestDirect(params) : requestViaBucket(params);
            return p.then(function (res) {
                if (res.raw !== null && res.raw !== undefined) return normalizeRequestResult(res.raw);
                // bucket 不可达(服务未开/端口变动)时降级为直连
                if (mode !== 'direct') return requestDirect(params).then(function (r2) {
                    return normalizeRequestResult(r2.raw);
                });
                return fail(res.err || ('HTTP ' + res.status), -10001);
            });
        };
        return attempt('bucket');
    }

    function normalizeRequestResult(body) {
        if (body !== null && typeof body === 'object' && body.result) {
            // 接口本身就返回 { result, data }，原样透传给调用方解析
            return body;
        }
        if (body !== null && typeof body === 'object' && typeof body.code === 'number') {
            // up366 标准接口响应 { code, msg, data } → 映射成 { result, data }
            // 保证 v() 的 { result:{code}, data } 解构拿到正确 payload
            return { result: { code: body.code, msg: body.msg || '' }, data: body.data };
        }
        // 其它结构统一包一层
        return ok(body);
    }

    // ======================= 分发入口 =======================

    function dispatch(name, params, callback) {
        var p = params || {};
        var resp;
        switch (name) {
            case 'getAppInfo':
                resp = ok(getAppInfoData());
                break;
            case 'getNTPTimestamp':
                resp = ok(Date.now());
                break;
            case 'getLaunchOptions':
                resp = ok({ referrerInfo: { extraData: {} }, extraData: {} });
                break;
            case 'showLoading':
            case 'setBackgroundColor':
            case 'log':
            case 'share':
            case 'openDictionary':
            case 'doContinue':
                resp = ok({});
                break;
            case 'openWebView':
                resp = ok(openWebView(p));
                break;
            case 'closeWebView':
                resp = ok(closeWebView());
                break;
            case 'request':
            case 'sdkRequest':
                try {
                    console.log('[Auto366:bridge] request url=' + (p.url || '') + ' data=' + String(p.data || '').slice(0, 120));
                } catch (e) {}
                gdiag('请求 ' + (p.url || '') + '  data=' + String(p.data || '').slice(0, 100));
                doRequest(p).then(function (r) {
                    try {
                        var __code = (r && r.result) ? r.result.code : '?';
                        var __d = '';
                        try { __d = JSON.stringify(r && r.data); } catch (e2) { __d = String(r && r.data); }
                        console.log('[Auto366:bridge] request ok code=' + __code + ' data=' + String(__d).slice(0, 220));
                    } catch (e) {}
                    gdiag('请求完成 code=' + __code + ' data=' + String(__d).slice(0, 160));
                    if (typeof callback === 'function') callback(r);
                }, function (e) {
                    try { console.log('[Auto366:bridge] request fail: ' + String(e && e.message || e)); } catch (e2) {}
                    gdiag('请求失败: ' + String(e && e.message || e));
                    if (typeof callback === 'function') callback(fail(e));
                });
                return;
            case 'exists':
                resp = ok(false);
                break;
            case 'getRootPath':
                resp = ok('');
                break;
            case 'mkdir':
            case 'writeFile':
            case 'readFile':
            case 'readDir':
                resp = ok('');
                break;
            default:
                resp = ok({});
        }
        callback(resp);
    }

    // ======================= 暴露桥 =======================

    var bridge = {
        init: function (cb) {
            if (typeof cb === 'function') { try { cb(bridge); } catch (e) {} }
        },
        callHandler: function (name, params, callback) {
            if (typeof params === 'function') { callback = params; params = {}; }
            params = params || {};
            dispatch(name, params, function (resp) {
                if (typeof callback === 'function') {
                    try { callback(resp); } catch (e) {}
                }
            });
        },
        registerHandler: function (name, cb) {
            if (name) jsHandlers[name] = cb;
        }
    };

    // ======================= 桥接管（桌面双保险） =======================

    // 桌面客户端(天学网)可能用 Object.defineProperty 以 configurable:false 注入原生桥，
    // 普通赋值/重新 defineProperty 都无法覆盖 window.WebViewJavascriptBridge。
    // 这里用「双保险」：
    //   1) 属性级覆盖 —— getter 返回我们的桥，setter 吞掉普通赋值；
    //   2) 对象级补丁 —— 把已存在的原生桥对象的 callHandler/registerHandler/init
    //      方法改造成转发到我们的桥（页面即使持有原生桥引用也走我们的逻辑）。

    // 在安装 getter 之前捕获原生桥引用（页面可能早已持有）
    var NATIVE_BRIDGE = null;
    try { NATIVE_BRIDGE = window.WebViewJavascriptBridge; } catch (e) {}

    function installGetter() {
        try {
            Object.defineProperty(window, 'WebViewJavascriptBridge', {
                get: function () { return bridge; },
                set: function () { /* 桌面端始终使用我们的桥，忽略普通覆盖 */ },
                configurable: true,
                enumerable: true
            });
            return true;
        } catch (e) {
            return false;
        }
    }

    function patchNativeBridge(nb) {
        if (!nb || typeof nb !== 'object') return;
        if (nb === bridge) return;
        if (nb.__a366patched) return;
        try {
            nb.__a366patched = true;
            if (typeof nb.__a366OrigCall === 'undefined') nb.__a366OrigCall = nb.callHandler;
            nb.callHandler = function (name, params, callback) {
                if (typeof params === 'function') { callback = params; params = {}; }
                return bridge.callHandler(name, params || {}, callback);
            };
            nb.registerHandler = function (name, cb) {
                return bridge.registerHandler(name, cb);
            };
            nb.init = function (cb) {
                return bridge.init(cb);
            };
            if (window.console) console.log('%c[Auto366] 已接管原生桥对象(callHandler→桌面桥)', 'color:#f5a623');
        } catch (e) { /* 对象冻结/只读时放弃，不破坏页面 */ }
    }

    function ensureBridgeActive() {
        installGetter();
        // 当前 window.WebViewJavascriptBridge 拿到的对象若不是我们的桥，补丁它
        var cur = null;
        try { cur = window.WebViewJavascriptBridge; } catch (e) {}
        if (cur && cur !== bridge) patchNativeBridge(cur);
        // 脚本开始时捕获到的原生桥引用（页面可能早已持有）一并补丁
        if (NATIVE_BRIDGE && NATIVE_BRIDGE !== bridge && NATIVE_BRIDGE !== cur) {
            patchNativeBridge(NATIVE_BRIDGE);
        }
    }
    ensureBridgeActive();

    // 兼容 iOS 检测路径：非 iOS 的检测函数用 WebViewJavascriptBridge；这里是纯浏览器兜底
    if (window.__up366_client_info__ === undefined) {
        window.__up366_client_info__ = getAppInfoData();
    }

    // 让等待中的 WVJBCallbacks 拿到实例（桥模块 ei() 走到该分支时）
    var pending = window.WVJBCallbacks;
    if (pending && pending.length) {
        pending.forEach(function (cb) { try { cb(bridge); } catch (e) {} });
    }
    window.WVJBCallbacks = [];

    // 宿主可能到页面加载完成才注入原生桥：轮询兜底，快速抢回/补丁（最多 ~60s）
    var reassertCount = 0;
    var reassertTimer = setInterval(function () {
        ensureBridgeActive();
        if (++reassertCount >= 120) clearInterval(reassertTimer);
    }, 500);

    // 便于调试：可手动触发 JS 侧 registerHandler 注册的事件
    bridge.__emit = function (name) {
        var args = Array.prototype.slice.call(arguments, 1);
        var h = jsHandlers[name];
        if (typeof h === 'function') { try { h.apply(null, args); } catch (e) {} }
    };

    console.log('%c[Auto366] 桌面桥接已注入: env=' + ENV + ', client=' + CLIENT, 'color:#f5a623;font-weight:bold');
    gdiag('桥已注入 env=' + ENV + ' client=' + CLIENT + ' | 桥接管状态: 原生桥' + (NATIVE_BRIDGE ? '已捕获' : '未检测到') + ' [生效:桌面桥]');
})();

</script>

    <script src="src/polyfills.bundle.5adbf.js?a366=2" charset="utf-8"> </script>


    <!-- SystemJS support. -->
    <script src="src/system.bundle.543e6.js?a366=2" charset="utf-8"> </script>

    <!-- Import map -->
    <script src="src/import-map.0b9d8.json?a366=2" type="systemjs-importmap" charset="utf-8"> </script>

    <script>
        // ===== 龙舟答题全自动脚本 + 简约控制面板 =====
        (function () {
            // 间隔毫秒（作答 -> 下一题的节拍），可在面板实时修改，运行中下个节拍自动生效
            var intervalMs = 10;
            var running = false;

            function log(msg) {
                console.log('%c[AutoRegatta] ' + msg, 'color:#f5a623;font-weight:bold');
            }
            function diag(m) { try { window.__gameDiag && window.__gameDiag(m); } catch (e) {} }

            function findAnswerArea() {
                if (typeof cc === 'undefined' || !cc.director) return null;
                var scene = cc.director.getScene();
                if (!scene) return null;
                var comps = scene.getComponentsInChildren(cc.Component);
                for (var i = 0; i < comps.length; i++) {
                    var c = comps[i];
                    if (c._answerIndex !== undefined && typeof c.onSelect === 'function' && typeof c.onNext === 'function') {
                        return c;
                    }
                }
                return null;
            }

            function autoAnswer(aa) {
                if (aa._answered) return;
                aa.onSelect(aa._answerIndex);
                log('自动作答 (答案索引=' + aa._answerIndex + ')');
            }

            function autoNext(aa) {
                if (!aa._answered) return;
                aa.onNext();
                log('自动下一题');
            }

            function startLoop(aa) {
                if (running) return;
                running = true;
                log('全自动模式已启动，间隔=' + intervalMs + 'ms');
                updateStatus();

                function tick() {
                    if (!running) return;
                    var a = findAnswerArea();
                    if (!a) { setTimeout(tick, 500); return; }
                    if (!a._answered) {
                        autoAnswer(a);
                        setTimeout(function () {
                            var a2 = findAnswerArea();
                            if (a2) autoNext(a2);
                            setTimeout(tick, intervalMs);
                        }, intervalMs);
                    } else {
                        autoNext(a);
                        setTimeout(tick, intervalMs);
                    }
                }
                tick();
            }

            function stopLoop() {
                running = false;
                log('全自动模式已停止');
                updateStatus();
            }

            // ================= 简约控制面板（白色极简，无 emoji） =================
            var panel = null, statusEl = null, intervalInput = null, startBtn = null, stopBtn = null;

            function updateStatus() {
                if (!statusEl) return;
                statusEl.textContent = running ? '运行中' : '已停止';
                statusEl.style.color = running ? '#2e7d32' : '#9e9e9e';
                if (startBtn) {
                    startBtn.style.background = running ? '#eeeeee' : '#2e7d32';
                    startBtn.style.color = running ? '#666666' : '#ffffff';
                }
                if (stopBtn) {
                    stopBtn.style.background = running ? '#e53935' : '#ffffff';
                    stopBtn.style.color = running ? '#ffffff' : '#666666';
                }
            }

            function setIntervalMs(v) {
                var n = parseInt(v, 10);
                if (!Number.isFinite(n) || n <= 0) return;
                intervalMs = n;
                if (intervalInput) intervalInput.value = String(n);
                log('间隔已设为 ' + intervalMs + 'ms');
            }

            function createPanel() {
                if (panel || !document.body) return;
                panel = document.createElement('div');
                panel.style.cssText = 'position:fixed;top:16px;right:16px;width:208px;background:#ffffff;color:#333333;' +
                    'border:1px solid #e3e3e3;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.10);' +
                    'padding:10px 12px;font:12px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;' +
                    'z-index:2147483646;user-select:none;';

                var title = document.createElement('div');
                title.textContent = '百舸自动答题';
                title.style.cssText = 'font-size:13px;font-weight:600;color:#333333;margin-bottom:8px;';
                panel.appendChild(title);

                var statusRow = document.createElement('div');
                statusRow.style.cssText = 'display:flex;align-items:center;margin-bottom:8px;color:#999999;';
                statusRow.appendChild(document.createTextNode('状态：'));
                statusEl = document.createElement('span');
                statusEl.textContent = '已停止';
                statusEl.style.color = '#9e9e9e';
                statusRow.appendChild(statusEl);
                panel.appendChild(statusRow);

                var intervalRow = document.createElement('div');
                intervalRow.style.cssText = 'display:flex;align-items:center;margin-bottom:6px;';
                var label = document.createElement('span');
                label.textContent = '间隔(ms)';
                label.style.cssText = 'color:#666666;margin-right:6px;white-space:nowrap;';
                intervalInput = document.createElement('input');
                intervalInput.type = 'number';
                intervalInput.min = '1';
                intervalInput.value = String(intervalMs);
                intervalInput.style.cssText = 'width:72px;padding:3px 6px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;color:#333333;background:#ffffff;box-sizing:border-box;';
                intervalInput.addEventListener('change', function () { setIntervalMs(intervalInput.value); });
                intervalInput.addEventListener('keypress', function (e) { if (e.key === 'Enter') { e.preventDefault(); setIntervalMs(intervalInput.value); } });
                intervalRow.appendChild(label);
                intervalRow.appendChild(intervalInput);
                panel.appendChild(intervalRow);

                var presetRow = document.createElement('div');
                presetRow.style.cssText = 'display:flex;gap:4px;margin-bottom:10px;';
                [10, 100, 1000].forEach(function (ms) {
                    var b = document.createElement('button');
                    b.textContent = ms + 'ms';
                    b.style.cssText = 'flex:1;padding:3px 0;font-size:11px;color:#555555;background:#ffffff;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer;';
                    b.addEventListener('click', function () { setIntervalMs(ms); });
                    presetRow.appendChild(b);
                });
                panel.appendChild(presetRow);

                var btnRow = document.createElement('div');
                btnRow.style.cssText = 'display:flex;gap:6px;';
                startBtn = document.createElement('button');
                startBtn.textContent = '开始';
                startBtn.style.cssText = 'flex:1;padding:5px 0;font-size:12px;border:none;border-radius:4px;cursor:pointer;';
                startBtn.addEventListener('click', function () {
                    if (running) return;
                    var a = findAnswerArea();
                    if (a) startLoop(a);
                    else { log('找不到答题区域，请等待游戏加载'); diag('找不到答题区域，请等待游戏加载'); }
                });
                stopBtn = document.createElement('button');
                stopBtn.textContent = '停止';
                stopBtn.style.cssText = 'flex:1;padding:5px 0;font-size:12px;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer;background:#ffffff;color:#666666;';
                stopBtn.addEventListener('click', function () { stopLoop(); });
                btnRow.appendChild(startBtn);
                btnRow.appendChild(stopBtn);
                panel.appendChild(btnRow);

                // 诊断层开关（联动左上角诊断层）
                var diagToggleBtn = null;
                window.__gameDiagPanelSync = function (st) {
                    if (diagToggleBtn) diagToggleBtn.textContent = (st && st.visible) ? '诊断：开' : '诊断：关';
                };
                var diagRow = document.createElement('div');
                diagRow.style.cssText = 'display:flex;margin-top:8px;';
                diagToggleBtn = document.createElement('button');
                diagToggleBtn.textContent = '诊断：开';
                diagToggleBtn.style.cssText = 'flex:1;padding:4px 0;font-size:12px;color:#333333;background:#ffffff;border:1px solid #d9d9d9;border-radius:4px;cursor:pointer;';
                diagToggleBtn.addEventListener('click', function () {
                    try {
                        if (window.__gameDiagLayer) window.__gameDiagLayer.toggle();
                        else log('诊断层尚未初始化');
                    } catch (e) {}
                });
                diagRow.appendChild(diagToggleBtn);
                panel.appendChild(diagRow);

                document.body.appendChild(panel);
                updateStatus();
                try {
                    var st = window.__gameDiagLayer ? { visible: window.__gameDiagLayer.isVisible(), collapsed: false } : { visible: true, collapsed: false };
                    if (window.__gameDiagPanelSync) window.__gameDiagPanelSync(st);
                } catch (e) {}
            }

            // 暴露到全局，方便外部控制
            window.AutoRegatta = {
                start: function () { var a = findAnswerArea(); if (a) startLoop(a); else log('找不到答题区域，请等待游戏加载'); },
                stop: stopLoop,
                setInterval: setIntervalMs,
                isRunning: function () { return running; }
            };

            // 等 Cocos 引擎就绪（默认停止，等用户点击"开始"再作答）
            var started = false;
            var wait = setInterval(function () {
                var a = findAnswerArea();
                if (!a) {
                    if (typeof cc !== 'undefined' && !started) {
                        started = true;
                        diag('Cocos(cc) 已就绪，等待答题区域…');
                    }
                    return;
                }
                clearInterval(wait);
                diag('已找到答题区域（默认停止，点击面板"开始"作答）');
            }, 500);
            setTimeout(function () {
                if (!started) diag('15s 未找到答题区域，Cocos 引擎可能未启动或渲染失败');
            }, 15000);

            // 面板：DOM 就绪后创建（脚本位于 body 末尾，通常已就绪）
            if (document.body) createPanel();
            else document.addEventListener('DOMContentLoaded', createPanel);
        })();
        System.import('./index.d6070.js').then(function () {
            try { window.__gameDiag && window.__gameDiag('System.import 成功 → Cocos 启动中'); } catch (e) {}
        }).catch(function (err) {
            console.error(err);
            try { window.__gameDiag && window.__gameDiag('System.import 失败: ' + (err && err.message || err)); } catch (e) {}
        })
    </script>

</body>
